services:
  db:
    image: postgres:16-alpine
    container_name: arc-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: arc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — run `npm run init:env`}
      POSTGRES_DB: arc
    ports:
      # Host access for psql/Studio; the app talks to db:5432 over the network.
      - "5434:5432"
    volumes:
      - arc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arc -d arc"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: syncs the schema. The app starts empty — you create the first
  # account through sign-up.
  migrate:
    build:
      context: .
      target: tools
    container_name: arc-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://arc:${POSTGRES_PASSWORD}@db:5432/arc?schema=public
    command: npx prisma db push

  web:
    build:
      context: .
      target: runner
    container_name: arc-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${PORT:-3321}:3321"
    environment:
      DATABASE_URL: postgresql://arc:${POSTGRES_PASSWORD}@db:5432/arc?schema=public
      APP_URL: ${APP_URL:-http://localhost:3321}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-secret-change-me-in-production}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Arc <onboarding@resend.dev>}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}

volumes:
  arc-pgdata:
